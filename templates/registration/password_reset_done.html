{% extends "base.html" %}

{% block title %}Reset Email Sent - TalentPanda{% endblock %}

{% block content %}

<style>
    .nc-success-page {
        min-height: 62vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 55px 0 70px;
    }

    .nc-success-card {
        width: 100%;
        max-width: 620px;
        position: relative;
        overflow: hidden;
        padding: 48px 35px;
        text-align: center;
        background: var(--nc-white, #ffffff);
        border: 1px solid var(--nc-border, #e1e8e4);
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(23, 34, 53, 0.07);
    }

    .nc-success-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--nc-primary, #159a78);
    }

    .nc-success-icon {
        width: 82px;
        height: 82px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        border-radius: 22px;
        background: var(--nc-primary-soft, #e8f6f1);
        color: var(--nc-primary, #159a78);
        font-size: 2.2rem;
    }

    .nc-success-title {
        color: var(--nc-heading, #172235);
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.35;
        margin: 0 0 12px;
    }

    .nc-success-message {
        max-width: 450px;
        margin: 0 auto 24px;
        color: var(--nc-text, #586678);
        font-size: 0.9rem;
        line-height: 1.7;
    }

    .nc-success-btn {
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.82rem;
        font-weight: 700;
        box-shadow: 0 7px 18px rgba(21, 154, 120, 0.14);
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .nc-success-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(21, 154, 120, 0.18);
    }

    @media (max-width: 575.98px) {
        .nc-success-page {
            min-height: 55vh;
            padding: 35px 15px 50px;
        }

        .nc-success-card {
            padding: 38px 22px;
            border-radius: 18px;
        }

        .nc-success-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            font-size: 1.9rem;
        }

        .nc-success-title {
            font-size: 1.3rem;
        }

        .nc-success-message {
            font-size: 0.86rem;
        }
    }
</style>


<div class="nc-success-page">

    <div class="container">

        <div class="nc-success-card mx-auto">

            <div class="nc-success-icon">
                <i class="bi bi-envelope-check"></i>
            </div>

            <h2 class="nc-success-title">
                Check your email
            </h2>

            <p class="nc-success-message">
                We've emailed you instructions for resetting your password.
            </p>

            <a
                href="{% url 'accounts:login' %}"
                class="btn btn-primary nc-success-btn"
            >
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
