{% extends "adminpanel/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="np-page-header">
    <div>
        <div class="np-breadcrumb">TalentPanda Admin</div>
        <h1 class="h4 mb-0">{{ page_title }}</h1>
    </div>
</div>

<div class="np-card" style="max-width:560px;">
    <p>Are you sure you want to delete:</p>
    <p class="fw-semibold fs-5">"{{ object }}"</p>
    <div class="alert alert-warning py-2 small">This action cannot be undone.</div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        {% if list_url_name %}<a href="{% url list_url_name %}" class="btn btn-outline-secondary">Cancel</a>{% endif %}
    </form>
</div>
{% endblock %}
