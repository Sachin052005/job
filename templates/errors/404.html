{% extends "base.html" %}

{% block title %}Page Not Found - TalentPanda{% endblock %}

{% block content %}

<style>
    .nc-error-page {
        min-height: 62vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 55px 0 70px;
    }

    .nc-error-card {
        width: 100%;
        max-width: 620px;
        position: relative;
        overflow: hidden;
        padding: 48px 35px;
        text-align: center;
        background: var(--nc-white, #ffffff);
        border: 1px solid var(--nc-border, #E2E8F0);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    .nc-error-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--nc-primary, #2563EB);
    }

    .nc-error-icon {
        width: 80px;
        height: 80px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        border-radius: 20px;
        background: var(--nc-primary-soft, #EFF6FF);
        color: var(--nc-primary, #2563EB);
        font-size: 2rem;
    }

    .nc-error-code {
        color: var(--nc-text-primary, #0F172A);
        font-size: 4.5rem;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0 0 14px;
    }

    .nc-error-message {
        max-width: 450px;
        margin: 0 auto 24px;
        color: var(--nc-text-secondary, #475569);
        font-size: 0.95rem;
        line-height: 1.7;
    }

    .nc-error-home-btn {
        border-radius: 10px;
        padding: 10px 22px;
        font-size: 0.85rem;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .nc-error-home-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    @media (max-width: 575.98px) {
        .nc-error-page {
            min-height: 55vh;
            padding: 35px 15px 50px;
        }

        .nc-error-card {
            padding: 38px 22px;
            border-radius: 18px;
        }

        .nc-error-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            font-size: 1.7rem;
        }

        .nc-error-code {
            font-size: 3.7rem;
        }

        .nc-error-message {
            font-size: 0.88rem;
        }
    }
</style>


<div class="nc-error-page">

    <div class="container">

        <div class="nc-error-card mx-auto">

            <div class="nc-error-icon">
                <i class="bi bi-signpost-split"></i>
            </div>

            <h1 class="nc-error-code">
                404
            </h1>

            <p class="nc-error-message">
                The page you're looking for doesn't exist or may have been moved.
            </p>

            <a
                href="{% url 'home' %}"
                class="btn btn-primary nc-error-home-btn"
            >
                Go to Homepage
            </a>

        </div>

    </div>

</div>

{% endblock %}
