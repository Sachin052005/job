{% extends "base.html" %}

{% block title %}Bad Request - NammaCareer{% endblock %}

{% block content %}

<style>
    .nc-error-page {
        min-height: 62vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 55px 0 70px;
    }

    .nc-error-card {
        width: 100%;
        max-width: 620px;
        position: relative;
        overflow: hidden;
        padding: 48px 35px;
        text-align: center;
        background: var(--nc-white, #ffffff);
        border: 1px solid var(--nc-border, #e1e8e4);
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(23, 34, 53, 0.07);
    }

    .nc-error-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--nc-primary, #159a78);
    }

    .nc-error-icon {
        width: 82px;
        height: 82px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        border-radius: 22px;
        background: #fff7e6;
        color: #f0a000;
        font-size: 2rem;
    }

    .nc-error-code {
        color: var(--nc-heading, #172235);
        font-size: 4.5rem;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.06em;
        margin: 0 0 14px;
    }

    .nc-error-message {
        max-width: 450px;
        margin: 0 auto 24px;
        color: var(--nc-text, #586678);
        font-size: 0.95rem;
        line-height: 1.7;
    }

    .nc-error-home-btn {
        border-radius: 10px;
        padding: 10px 19px;
        font-size: 0.82rem;
        font-weight: 700;
        box-shadow: 0 7px 18px rgba(21, 154, 120, 0.14);
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .nc-error-home-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(21, 154, 120, 0.18);
    }

    @media (max-width: 575.98px) {
        .nc-error-page {
            min-height: 55vh;
            padding: 35px 15px 50px;
        }

        .nc-error-card {
            padding: 38px 22px;
            border-radius: 18px;
        }

        .nc-error-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            font-size: 1.7rem;
        }

        .nc-error-code {
            font-size: 3.7rem;
        }

        .nc-error-message {
            font-size: 0.88rem;
        }
    }
</style>


<div class="nc-error-page">

    <div class="container">

        <div class="nc-error-card mx-auto">

            <div class="nc-error-icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>

            <h1 class="nc-error-code">
                400
            </h1>

            <p class="nc-error-message">
                Your request could not be understood by the server.
            </p>

            <a
                href="{% url 'home' %}"
                class="btn btn-primary nc-error-home-btn"
            >
                Go to Homepage
            </a>

        </div>

    </div>

</div>

{% endblock %}
