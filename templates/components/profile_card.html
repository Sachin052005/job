<style>
    .nc-profile-card {
        position: relative;
        overflow: hidden;
        background: var(--nc-surface, #ffffff);
        border: 1px solid var(--nc-border, #E2E8F0);
        border-radius: 14px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease;
    }

    .nc-profile-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--nc-primary, #2563EB);
    }

    .nc-profile-card-body {
        padding: 24px 20px 20px;
        text-align: center;
    }

    .nc-profile-avatar {
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563EB, #174EA6);
        border: 2px solid #FFFFFF;
        color: #ffffff;
        font-size: 1.8rem;
        font-weight: 800;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    .nc-profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .nc-profile-name {
        color: var(--nc-text-heading, #172033);
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.4;
        margin-bottom: 5px;
    }

    .nc-profile-headline {
        min-height: 21px;
        color: var(--nc-text-secondary, #475569);
        font-size: 0.8rem;
        line-height: 1.5;
        margin-bottom: 16px;
    }

    .nc-profile-progress {
        margin-bottom: 9px;
        height: 8px;
        background: #F1F5F9;
        border-radius: 999px;
    }

    .nc-profile-progress .progress-bar {
        background: #10B981;
        border-radius: 999px;
    }

    .nc-profile-completion {
        color: var(--nc-text-muted, #64748B);
        font-size: 0.75rem;
        margin: 0;
    }

    @media (max-width: 575.98px) {
        .nc-profile-card-body {
            padding: 22px 18px 20px;
        }

        .nc-profile-avatar {
            width: 72px;
            height: 72px;
            font-size: 1.6rem;
        }
    }
</style>


<div class="nc-profile-card">

    <div class="nc-profile-card-body">

        <div class="nc-profile-avatar">

            {% if profile.photo %}

                <img
                    src="{{ profile.photo.url }}"
                    alt="{{ profile.user.username }}"
                >

            {% else %}

                {{ profile.user.username|slice:":1"|upper }}

            {% endif %}

        </div>


        <h5 class="nc-profile-name">
            {{ profile.user.get_full_name|default:profile.user.username }}
        </h5>


        <p class="nc-profile-headline">
            {{ profile.headline|default:profile.get_role_display }}
        </p>


        <div
            class="progress nc-profile-progress"
            role="progressbar"
            aria-valuenow="{{ profile.completion_percent }}"
            aria-valuemin="0"
            aria-valuemax="100"
        >
            <div
                class="progress-bar"
                data-progress="{{ profile.completion_percent }}"
            ></div>
        </div>


        <p class="nc-profile-completion">
            Profile {{ profile.completion_percent }}% complete
        </p>

    </div>

</div>
