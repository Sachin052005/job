{% extends "accounts/settings/_base.html" %}

{% block settings_content %}
<h5 class="mb-3">Privacy</h5>

<form method="post">
    {% csrf_token %}

    <label class="fw-bold mb-2 d-block">Profile Visibility</label>
    <div class="d-flex flex-column gap-2 mb-4">
        {% for radio in form.profile_visibility %}
            <label class="d-flex align-items-center gap-2">
                {{ radio.tag }} {{ radio.choice_label }}
            </label>
        {% endfor %}
    </div>

    {% for field in form %}
        {% if field.name != "profile_visibility" %}
        <div class="d-flex align-items-center justify-content-between py-3 border-bottom" style="border-color: var(--nc-border, #e1e8e4) !important;">
            <span class="fw-semibold">{{ field.label }}</span>
            <div class="form-check form-switch">{{ field }}</div>
        </div>
        {% endif %}
    {% endfor %}

    <button type="submit" class="btn btn-primary mt-4">Save Changes</button>
</form>
{% endblock %}
