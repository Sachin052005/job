{% extends "accounts/settings/_base.html" %}

{% block settings_content %}
<h5 class="mb-1">Appearance</h5>
<p class="text-muted small mb-4">Choose your preferred theme.</p>

<form method="post">
    {% csrf_token %}

    <div class="d-flex flex-column gap-3 mb-4">
        {% for radio in theme_form.theme %}
            <label class="d-flex align-items-center gap-2 p-3 border rounded-3" style="border-color: var(--nc-border, #e1e8e4) !important; cursor: pointer;">
                {{ radio.tag }}
                <span class="fw-semibold">{{ radio.choice_label }}</span>
            </label>
        {% endfor %}
    </div>

    <button type="submit" class="btn btn-primary">Save Preference</button>
</form>
{% endblock %}
