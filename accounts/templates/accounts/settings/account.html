{% extends "accounts/settings/_base.html" %}
{% load form_tags %}

{% block settings_content %}
<h5 class="mb-3">Account</h5>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="fw-bold mb-1">First Name</label>
        {{ user_form.first_name|add_class:"form-control" }}
    </div>
    <div class="mb-3">
        <label class="fw-bold mb-1">Last Name</label>
        {{ user_form.last_name|add_class:"form-control" }}
    </div>
    <div class="mb-3">
        <label class="fw-bold mb-1">Email</label>
        {{ user_form.email|add_class:"form-control" }}
    </div>
    <div class="mb-3">
        <label class="fw-bold mb-1">Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled>
    </div>
    <div class="mb-4">
        <label class="fw-bold mb-1">Account Type</label>
        <input type="text" class="form-control" value="{{ user.profile.get_role_display }}" disabled>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
