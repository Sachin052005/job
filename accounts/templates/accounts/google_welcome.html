{% extends "base.html" %}

{% block title %}Welcome to NammaCareer{% endblock %}

{% block content %}
<div class="container" style="max-width: 620px; padding: 60px 0;">

    <div class="text-center mb-4">
        <h2 style="color: var(--nc-heading, #172235); font-weight: 800;">Welcome to NammaCareer</h2>
        <p class="text-muted">Tell us why you're here so we can set things up for you.</p>
    </div>

    <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-md-6">
            <button type="submit" name="choice" value="job_seeker" class="btn btn-outline-primary w-100 py-4">
                <i class="bi bi-search d-block mb-2" style="font-size: 1.6rem;"></i>
                I am looking for a job
            </button>
        </div>

        <div class="col-md-6">
            <button type="submit" name="choice" value="employer" class="btn btn-outline-primary w-100 py-4">
                <i class="bi bi-briefcase d-block mb-2" style="font-size: 1.6rem;"></i>
                I am hiring candidates
            </button>
        </div>
    </form>

</div>
{% endblock %}
