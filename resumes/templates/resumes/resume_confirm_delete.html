{% extends "base.html" %}

{% block title %}Delete Resume - NammaCareer{% endblock %}

{% block content %}
<div class="container" style="padding: 42px 0 70px; max-width: 480px;">
    <h2 class="mb-4" style="color: var(--nc-heading, #172235); font-weight: 800;">Delete Resume</h2>
    <div class="card p-4" style="border-radius: 16px; border-color: var(--nc-border, #e1e8e4);">
        <p>Are you sure you want to delete <strong>{{ object.title }}</strong>? This also deletes all of its scans, issues, and job matches. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <a href="{% url 'resumes:list' %}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
                <button type="submit" class="btn btn-danger flex-grow-1">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
